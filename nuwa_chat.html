<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuwa Web Chat</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify for XSS Protection -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --sidebar-bg: rgba(20, 24, 39, 0.85);
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #f0f2f5;
            --text-muted: #a0aabf;
            --accent: #6b4cff;
            --accent-hover: #8367ff;
            --bot-bubble: rgba(107, 76, 255, 0.15);
            --user-bubble: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #b09fff, #6b4cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .character-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .sidebar-search {
            padding: 0 8px 16px 8px;
        }
        
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .sidebar-search input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            padding: 10px 30px 10px 14px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            font-size: 0.85rem;
        }
        
        .sidebar-search input:focus {
            border-color: var(--accent);
        }

        .search-clear {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            transition: color 0.2s;
        }

        .search-clear:hover {
            color: var(--text-main);
        }

        .tag-description {
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(107, 76, 255, 0.1);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.4;
        }
        
        .character-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }
        
        .skill-tag {
            background: rgba(107, 76, 255, 0.15);
            color: #b09fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(107, 76, 255, 0.3);
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .skill-tag:hover {
            background: rgba(107, 76, 255, 0.4);
            transform: translateY(-1px);
        }

        .tag-dropdown-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: #1a1e30;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-height: 250px;
            overflow-y: auto;
        }

        .tag-dropdown-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sidebar-category-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 16px 0 8px 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .character-item {
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .character-item:hover {
            background: var(--card-bg);
        }

        .character-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(107, 76, 255, 0.3);
        }

        .character-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .character-info h3 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .character-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .character-item.active .character-info p {
            color: rgba(255, 255, 255, 0.8);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: var(--accent);
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Chat Area */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1a1e30, #0f111a);
        }

        .chat-header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 26, 0.6);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .current-character h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .current-character p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .chat-history {
            flex-grow: 1;
            padding: 32px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user {
            align-items: flex-end;
        }

        .message-wrapper.bot {
            align-items: flex-start;
        }

        .message-wrapper.system {
            align-items: center;
            margin-bottom: 16px;
        }

        .message-sender {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .message-bubble.system {
            max-width: 90%;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .message-wrapper.user .message-bubble {
            background: var(--user-bubble);
            border: 1px solid var(--border);
            border-bottom-right-radius: 4px;
        }

        .message-wrapper.bot .message-bubble {
            background: var(--bot-bubble);
            border: 1px solid rgba(107, 76, 255, 0.3);
            border-bottom-left-radius: 4px;
        }

        /* Markdown Styles within Bubble */
        .message-bubble p {
            margin-bottom: 12px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble h1,
        .message-bubble h2,
        .message-bubble h3 {
            margin: 16px 0 8px 0;
        }

        .message-bubble ul,
        .message-bubble ol {
            margin: 12px 0 12px 24px;
        }

        .message-bubble pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-bubble code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message-bubble pre code {
            background: transparent;
            padding: 0;
        }

        .message-bubble blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            margin: 12px 0;
            color: #d0d5e0;
        }

        /* Auto select animation */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            height: 24px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .input-area {
            padding: 24px 32px;
            background: rgba(15, 17, 26, 0.8);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .input-box {
            flex-grow: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            min-height: 56px;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-box:focus {
            border-color: var(--accent);
        }

        .send-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* History Sidebar */
        .history-sidebar {
            border-right: none;
            border-left: 1px solid var(--border);
            width: 280px;
        }

        .history-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item:hover {
            background: var(--card-bg);
            border-color: var(--border);
        }

        .history-item.active {
            background: rgba(107, 76, 255, 0.15);
            border-color: var(--accent);
        }

        .history-item-title {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .history-item-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .history-item-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .history-item:hover .history-item-actions,
        .history-item.active .history-item-actions {
            opacity: 1;
        }

        .del-history-btn {
            background: rgba(255, 76, 76, 0.1);
            border: 1px solid rgba(255, 76, 76, 0.3);
            color: #ff6b6b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        .del-history-btn:hover {
            background: rgba(255, 76, 76, 0.2);
            color: #fff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-box {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-box h2 {
            margin-bottom: 16px;
            font-size: 1.4rem;
        }

        .modal-box p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
        }

        .empty-state {
            display: flex;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            opacity: 0.5;
            text-align: center;
        }

        .empty-state h1 {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>女媧核心</h1>
        </div>
        <div class="character-list" id="sidebarList">
            <!-- Dynamically populated -->
        </div>
        <div class="sidebar-footer">
            <button class="btn" onclick="openSettings()">
                ⚙️ API 設定
            </button>
            <button class="btn" onclick="exportChat()">
                📥 匯出對話 (.md)
            </button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="current-character" id="chatHeaderInfo">
                <h2>系統就緒</h2>
                <p>請先設定 API Key 並選擇角色</p>
            </div>
            <div class="clear-btn">
                <button class="btn" onclick="newChat()">📝 新對話</button>
            </div>
        </div>

        <div class="chat-history" id="chatBox">
            <div class="empty-state">
                <h1>✨</h1>
                <p>選擇一個角色，或交由 AI 自動為您決策</p>
            </div>
        </div>

        <div class="input-area">
            <textarea class="input-box" id="userInput" placeholder="請輸入訊息 (Shift+Enter 換行, Enter 傳送)..."
                rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- History Sidebar -->
    <div class="sidebar history-sidebar">
        <div class="sidebar-header" style="display: flex; align-items: center; min-height: 81px;">
            <h1 style="font-size: 1.25rem;">對話歷史</h1>
        </div>
        <div class="character-list" id="historyList">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- API Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <h2>⚙️ API 設定</h2>
            <p>本對話系統串接 Google Gemini API 來獲得 AI 回應。您的金鑰僅儲存於本機瀏覽器，不會上傳至其他伺服器。不知道怎麼申請？<a href="https://github.com/etrnya/nuwa-skill_html/blob/main/API-KEY-SETUP.md" target="_blank" style="color: var(--accent); text-decoration: underline;">查看 API Key 申請教學</a></p>
            <div class="form-group">
                <label class="form-label">Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="form-input" placeholder="AIzaSy...">
            </div>
            <div class="form-group">
                <label class="form-label">預設模型 (Model)</label>
                <select id="modelInput" class="form-input">
                    <option value="gemini-2.5-flash">gemini-2.5-flash (預設，最新快速)</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro (最新強大)</option>
                    <option value="gemini-1.5-flash">gemini-1.5-flash (上一代，高負載時的穩定備用)</option>
                    <option value="gemini-1.5-pro">gemini-1.5-pro (上一代，強大備用)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">使用者背景資料 (User Context)</label>
                <details style="margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted);">
                    <summary style="cursor: pointer; color: var(--accent); user-select: none; font-weight: 500;">💡 如何讓大師更懂你？(點擊獲取萃取提示詞)</summary>
                    <div style="margin-top: 8px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border); line-height: 1.5;">
                        背景資料越詳細，AI 的視角回答會越精準。請複製下方提示詞，貼給您最常用的 AI（如 ChatGPT 或 Claude），讓它分析你們的歷史對話，再將產生的結果貼到下方的輸入框中：
                        <div style="position: relative; margin-top: 8px;">
                            <textarea id="copyPrompt" readonly class="form-input" style="font-size: 0.75rem; height: 100px; resize: none; background: rgba(0,0,0,0.3); color: #8a93a6; padding-right: 60px;">你的工作是瀏覽我們過去的對話，然後總結你對我的瞭解。 請勿在輸出內容中使用第一人稱代名詞 (我、我的) 和第二人稱代名詞 (你、你的)，而是改用「使用者」或中性用語，稱呼你從資料中瞭解的這個對象。 盡可能保留使用者說的每一字句，特別是指令與偏好設定。 類別 (照以下順序輸出)： 1. 使用者資訊：慣用名稱、職業、教育程度和居住地。 2. 興趣與偏好：持續積極參與的活動 (不只是擁有某個物品或購買過一次的東西)。 3. 關係：已確認的長期關係。 4. 標註日期的事件、專案與計畫：近期重大活動的記錄。 5. 指令：我明確要求你在之後遵守的規則，包括「哪些一定要做」、「哪些絕對不能做」，以及對你之前行為的更正。僅納入個人化記憶中的規則，不含對話內容。 格式： 將內容依上述類別分段。盡量引用我在提示詞說過的原話，證明你總結的各個項目。按照下列格式建立各個項目： 使用者的名字是<name>。 - 證據：使用者說「叫我<name>」。日期：[YYYY-MM-DD]。 輸出內容： - 將最終輸出摘要的格式設為文字區塊。</textarea>
                            <button onclick="navigator.clipboard.writeText(document.getElementById('copyPrompt').value); const btn=this; btn.innerText='已複製!'; setTimeout(()=>btn.innerText='複製', 2000);" style="position: absolute; right: 8px; top: 8px; background: rgba(107, 76, 255, 0.8); color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;">複製</button>
                        </div>
                    </div>
                </details>
                <textarea id="userContextInput" class="form-input" rows="6" style="resize: vertical;"

            // Populate all tags container

            if(allTagsContainer) {
                let tagsHtml = '';
                Object.keys(TAG_DESCRIPTIONS).forEach(tag => {
                    tagsHtml += `<span class="skill-tag" onmousedown="searchTag('${tag}', event)">#${tag}</span>`;
                });
                allTagsContainer.innerHTML = tagsHtml;
            }

            // Search Input logic
            const searchInput = document.getElementById('searchInput');
            if(searchInput) {
                searchInput.addEventListener('focus', function() {
                    if (this.value.trim() === '') {
                        document.getElementById('tagDropdownPanel').style.display = 'block';
                    }
                });

                searchInput.addEventListener('blur', function() {
                    document.getElementById('tagDropdownPanel').style.display = 'none';
                });

                searchInput.addEventListener('input', function() {
                    const query = this.value.toLowerCase().trim();
                    const items = document.querySelectorAll('.character-item[data-search]');
                    const catHeaders = document.querySelectorAll('.sidebar-category-title');
                    
                    // Hide dropdown if user starts typing
                    if (query !== '') {
                        document.getElementById('tagDropdownPanel').style.display = 'none';
                    } else {
                        document.getElementById('tagDropdownPanel').style.display = 'block';
                    }
                    
                    const catVisibleCount = {};
                    catHeaders.forEach(el => catVisibleCount[el.id] = 0);
                    
                    // Show/hide clear button
                    const clearBtn = document.getElementById('searchClear');
                    if (clearBtn) {
                        clearBtn.style.display = query.length > 0 ? 'block' : 'none';
                    }

                    // Show/hide tag description
                    const tagDescEl = document.getElementById('tagDescription');
                    if (tagDescEl) {
                        if (query.startsWith('#')) {
                            // Extract exact tag (without '#')
                            const tagQueryRaw = this.value.trim().substring(1);
                            if (TAG_DESCRIPTIONS[tagQueryRaw]) {
                                tagDescEl.innerText = TAG_DESCRIPTIONS[tagQueryRaw];
                                tagDescEl.style.display = 'block';
                            } else {
                                tagDescEl.style.display = 'none';
                            }
                        } else {
                            tagDescEl.style.display = 'none';
                        }
                    }

                    items.forEach(item => {
                        const searchData = item.getAttribute('data-search');
                        const catId = item.getAttribute('data-cat');
                        
                        let isMatch = false;
                        if (query === '') {
                            isMatch = true;
                        } else if (query.startsWith('#')) {
                            // Tag exact match
                            const tagQuery = query.substring(1);
                            isMatch = searchData.includes(tagQuery);
                        } else {
                            // Keyword match
                            isMatch = searchData.includes(query);
                        }
                        
                        if (isMatch) {
                            item.style.display = 'flex';
                            if (catId) catVisibleCount[catId]++;
                        } else {
                            item.style.display = 'none';
                        }
                    });
                    
                    catHeaders.forEach(el => {
                        if (catVisibleCount[el.id] === 0) {
                            el.style.display = 'none';
                        } else {
                            el.style.display = 'block';
                        }
                    });
                });
            }
        }

        function selectSkill(id, keepHistory = false) {
            // Remove active classes
            document.querySelectorAll('.character-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`nav-${id}`);
            if (activeEl) activeEl.classList.add('active');

            currentSkillId = id;

            if (!keepHistory) {
                currentChatId = Date.now().toString();
                dialogHistory = [];
                DOM.chatBox.innerHTML = '<div class="message-wrapper system"><div class="message-bubble system">對話已重置</div></div>';
            }

            if (id === AUTO_MODE_ID) {
                DOM.chatHeaderInfo.innerHTML = `
                    <h2>🤖 AI 自動挑選</h2>
                    <p>我會依據您的提問自動戴上最適合的面具</p>
                `;
            } else {
                const skill = window.NUWA_SKILLS.find(s => s.id === id);
                if (skill) {
                    DOM.chatHeaderInfo.innerHTML = `
                        <h2>${skill.name}</h2>
                        <p>${skill.description.substring(0, 50)}...</p>
                    `;
                }
            }

            if (!keepHistory) {
                renderHistorySidebar();
            }
        }

        function newChat() {
            currentChatId = Date.now().toString();
            dialogHistory = [];
            DOM.chatBox.innerHTML = '<div class="message-wrapper system"><div class="message-bubble system">對話已開始</div></div>';
            renderHistorySidebar();
        }

        function renderHistorySidebar() {
            if (savedChats.length === 0) {
                DOM.historyList.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size: 0.9rem; text-align: center;">尚未有任何對話紀錄</div>';
                return;
            }
            let html = '';
            savedChats.forEach(chat => {
                const date = new Date(chat.timestamp).toLocaleString('zh-TW');
                const activeClass = chat.id === currentChatId ? 'active' : '';
                html += `
                    <div class="history-item ${activeClass}" onclick="loadChat('${chat.id}')">
                        <div class="history-item-title">${chat.title}</div>
                        <div class="history-item-time">${date}</div>
                        <div class="history-item-actions">
                            <button class="del-history-btn" onclick="deleteChat('${chat.id}', event)">刪除</button>
                        </div>
                    </div>
                `;
            });
            DOM.historyList.innerHTML = html;
        }

        function saveCurrentChatState() {
            if (dialogHistory.length === 0) return;

            let chatIndex = savedChats.findIndex(c => c.id === currentChatId);

            let firstUserMsg = dialogHistory.find(m => m.role === 'user');
            let title = firstUserMsg ? firstUserMsg.parts[0].text.substring(0, 30) : '新對話';

            let chatData = {
                id: currentChatId,
                title: title,
                timestamp: Date.now(),
                skillId: currentSkillId,
                history: JSON.parse(JSON.stringify(dialogHistory))
            };

            if (chatIndex >= 0) {
                savedChats[chatIndex] = chatData;
                // Move updated chat to the top
                savedChats.splice(chatIndex, 1);
                savedChats.unshift(chatData);
            } else {
                savedChats.unshift(chatData);
            }

            localStorage.setItem('nuwa_saved_chats', JSON.stringify(savedChats));
            renderHistorySidebar();
        }

        function loadChat(chatId) {
            const chat = savedChats.find(c => c.id === chatId);
            if (!chat) return;

            currentChatId = chat.id;
            selectSkill(chat.skillId, true);

            dialogHistory = JSON.parse(JSON.stringify(chat.history));

            DOM.chatBox.innerHTML = '';
            dialogHistory.forEach(msg => {
                const role = msg.role;
                let name = '系統';
                let isHtml = false;
                let text = msg.parts[0].text;

                if (role === 'user') {
                    name = '您';
                } else if (role === 'model') {
                    name = 'AI';
                    if (currentSkillId !== AUTO_MODE_ID) {
                        const s = window.NUWA_SKILLS.find(x => x.id === currentSkillId);
                        if (s) name = s.name;
                    }
                    isHtml = true;
                    text = DOMPurify.sanitize(marked.parse(text));
                }

                appendMessage(role, name, text, isHtml);
            });
            renderHistorySidebar();
        }

        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (!confirm('確定刪除這筆對話紀錄？')) return;
            savedChats = savedChats.filter(c => c.id !== chatId);
            localStorage.setItem('nuwa_saved_chats', JSON.stringify(savedChats));
            if (currentChatId === chatId) {
                newChat();
            } else {
                renderHistorySidebar();
            }
        }

        function appendMessage(role, name, text, isHtml = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;

            const sender = document.createElement('div');
            sender.className = 'message-sender';
            sender.textContent = name;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (role === 'system') {
                wrapper.className = 'message-wrapper system';
                bubble.className = 'message-bubble system';
            }

            if (isHtml) {
                // Sanitize HTML before inserting to prevent XSS
                bubble.innerHTML = DOMPurify.sanitize(text);
            } else {
                bubble.textContent = text;
            }

            if (role !== 'system') wrapper.appendChild(sender);
            wrapper.appendChild(bubble);
            DOM.chatBox.appendChild(wrapper);
            DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
            return bubble; // returning bubble so we can update it if typing
        }

        async function sendMessage() {
            const text = DOM.userInput.value.trim();
            if (!text) return;
            if (!config.apiKey) {
                alert('請先點擊左下角設定 API Key');
                openSettings();
                return;
            }

            // UI Changes
            appendMessage('user', '您', text, false);
            DOM.userInput.value = '';
            DOM.userInput.style.height = '56px';
            DOM.sendBtn.disabled = true;

            dialogHistory.push({ role: 'user', parts: [{ text: text }] });
            saveCurrentChatState();

            // Show typing indicator
            const typingBubble = appendMessage('bot', '...', '<div class="typing-indicator"><span></span><span></span><span></span></div>', true);

            try {
                let actualSkillId = currentSkillId;

                // 1. If Auto Mode, determine the character first
                if (currentSkillId === AUTO_MODE_ID) {
                    appendMessage('system', '系統', `🤔 正在分析需求以挑選最適合的思維框架...`, false);
                    actualSkillId = await autoSelectCharacter(text);
                    if (!actualSkillId) {
                        throw new Error("無法決定角色");
                    }
                    const s = window.NUWA_SKILLS.find(x => x.id === actualSkillId);
                    appendMessage('system', '系統', `🎯 AI 已將視角切換為：${s ? s.name : actualSkillId}`, false);
                    typingBubble.parentElement.querySelector('.message-sender').textContent = s.name;
                }

                // 2. Fetch Character Data
                const skill = window.NUWA_SKILLS.find(s => s.id === actualSkillId);
                if (!skill) throw new Error("找不到角色資料");

                // Update sender name if not auto mode
                if (currentSkillId !== AUTO_MODE_ID) {
                    typingBubble.parentElement.querySelector('.message-sender').textContent = skill.name;
                }

                // 3. Make the API Call to Gemini
                // Note: Add logic to use specific model / API structure. We'll use Gemini REST API.
                let finalSystemPrompt = skill.system_prompt;
                if (config.userContext) {
                    finalSystemPrompt += `\n\n### 關於使用者的背景資料 ###\n${config.userContext}\n\n### 指示 ###\n請在思考與回覆時，充分考慮上述關於使用者的背景資料。`;
                }

                // Enforce Output Format and Traditional Chinese
                finalSystemPrompt += `\n\n### 全局輸出與語言規範 (最高優先級) ###\n1. 【語言絕對要求】：請務必、絕對要使用「繁體中文 (zh-TW)」對話，包含思考過程。絕對不可使用簡體字。\n2. 【結構化表達 - 金字塔原則】：除非使用者明確要求自由發散，否則你的所有回答必須遵循「結論先行，以上統下，歸類分組」的金字塔原則。避免長篇大論的流水帳，第一段直接給出核心結論，後續再以互相獨立互不遺漏 (MECE) 的要點進行支撐。\n3. 【案例與經驗分析 - STAR 法則】：當你在舉例、分析過往事件或拆解商業案例時，請強制使用情境 (Situation)、任務 (Task)、行動 (Action)、結果 (Result) 的模版結構來敘事，確保邏輯清晰俐落。`;


                const payload = {
                    system_instruction: { parts: [{ text: finalSystemPrompt }] },
                    contents: dialogHistory,
                    generationConfig: {
                        temperature: 0.7,
                    }
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (!data.candidates || data.candidates.length === 0) {
                    if (data.promptFeedback && data.promptFeedback.blockReason) {
                        throw new Error("AI 安全審查攔截了此請求 (原因：" + data.promptFeedback.blockReason + ")");
                    }
                    throw new Error("API 回傳了非預期的空結果");
                }

                const candidate = data.candidates[0];
                if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
                    throw new Error("AI 回應被中斷或沒有內容 (結束原因：" + candidate.finishReason + ")");
                }

                const botReply = candidate.content.parts[0].text;
                dialogHistory.push({ role: 'model', parts: [{ text: botReply }] });
                saveCurrentChatState();

                // Render Response with Markdown
                const rawMarkup = marked.parse(botReply);
                const safeMarkup = DOMPurify.sanitize(rawMarkup);
                typingBubble.innerHTML = safeMarkup;

            } catch (error) {
                console.error(error);
                typingBubble.textContent = "❌ 發生錯誤：" + error.message;
                // Pop the user prompt if failed
                if (dialogHistory.length > 0 && dialogHistory[dialogHistory.length - 1].role === 'user') {
                    dialogHistory.pop();
                }
            } finally {
                DOM.sendBtn.disabled = false;
                DOM.userInput.focus();
                DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
            }
        }

        async function autoSelectCharacter(userMessage) {
            let characterListStr = window.NUWA_SKILLS.map(s => `- ID: ${s.id} | Name: ${s.name} | Desc: ${s.description.split('\n')[0].substring(0, 100)}`).join('\n');
            const prompt = `You are a router. A user has a question. Which of these characters is best suited to answer their perspective?
Characters:
${characterListStr}

User's input: "${userMessage}"

Reply ONLY with the ID of the chosen character. Do not include markdown, explanation, or quotes.`;

            const payload = {
                contents: [{ role: 'user', parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.1 } // Removed maxOutputTokens to prevent API cut-offs
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const defaultId = window.NUWA_SKILLS[0].id;

                if (data.error || !data.candidates || data.candidates.length === 0) {
                    console.warn("自動選角發生例外或攔截，使用預設角色...", data);
                    return defaultId;
                }

                const candidate = data.candidates[0];
                if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
                    console.warn("自動選角回應異常 (結束原因：" + candidate.finishReason + ")，使用預設角色...");
                    return defaultId;
                }

                const rawId = candidate.content.parts[0].text;
                let bestId = defaultId;

                // Robust matching: Check if any of our skilled ID is mentioned in the response
                for (const s of window.NUWA_SKILLS) {
                    if (rawId.includes(s.id)) {
                        bestId = s.id;
                        break;
                    }
                }
                return bestId;
            } catch (err) {
                console.error("Auto router request failed:", err);
                return window.NUWA_SKILLS[0].id; // Fallback to safe default
            }
        }

        // Settings Modal
        function openSettings() {
            DOM.apiKeyInput.value = config.apiKey;
            DOM.modelInput.value = config.model;
            DOM.userContextInput.value = config.userContext;
            DOM.settingsModal.classList.add('active');
        }

        function closeSettings() {
            if (!config.apiKey) {
                alert('警告：未設定 API Key，系統無法運作。');
            }
            DOM.settingsModal.classList.remove('active');
        }

        function saveSettings() {
            config.apiKey = DOM.apiKeyInput.value.trim();
            config.model = DOM.modelInput.value.trim() || 'gemini-2.5-flash';
            config.userContext = DOM.userContextInput.value.trim();
            localStorage.setItem('nuwa_api_key', config.apiKey);
            localStorage.setItem('nuwa_api_model', config.model);
            localStorage.setItem('nuwa_user_context', config.userContext);
            closeSettings();
        }

        // Export feature
        function exportChat() {
            if (dialogHistory.length === 0) {
                alert("目前沒有對話紀錄可匯出");
                return;
            }

            let skillName = "Auto_Mode";
            if (currentSkillId !== AUTO_MODE_ID) {
                const s = window.NUWA_SKILLS.find(x => x.id === currentSkillId);
                if (s) skillName = s.name;
            }

            let markdown = `# Nuwa Chat Export\n\n`;
            markdown += `**角色 (Skill)**: ${skillName}\n`;
            markdown += `**時間 (Date)**: ${new Date().toLocaleString()}\n\n---\n\n`;

            dialogHistory.forEach(msg => {
                const role = msg.role === 'user' ? '👤 您 (User)' : '🤖 角色 (AI)';
                markdown += `### ${role}\n${msg.parts[0].text}\n\n`;
            });

            const blob = new Blob([markdown], { type: "text/markdown;charset=utf-8" });
            const userUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = userUrl;
            a.download = `Nuwa_Chat_${new Date().getTime()}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(userUrl);
        }

        // Run
        window.addEventListener('DOMContentLoaded', init);
    </script>
